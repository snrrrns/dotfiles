onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml
# Managed via dotfiles: symlinked from ~/dotfiles/herdr/config.toml

[keys]
prefix = "ctrl+t"

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
pane_gaps = false
pane_scrollbars = false
agent_panel_sort = "priority"
host_cursor = "drawn"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[ui.sound]
enabled = false

[ui.toast]
delivery = "off"
